# ============================================================
# 智能报价系统 - Nginx 站点配置
# 部署位置: /etc/nginx/sites-available/smart-quotation
#
# 说明：
#   1) 默认监听 80，部署脚本会替换为实际外部端口（默认 8085）
#   2) 后端 /api 反向代理到 127.0.0.1:8008（部署脚本会替换后端端口）
#   3) 修改后执行: nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name _;

    # 上传/下载文件大小上限（含图片的 Excel 可能较大；本实例曾上传 ~267MB 的含图表格）
    client_max_body_size 500m;
    # 上传请求体接收超时放宽到 300s（默认 60s；慢上行链路传 1MB+ 也可能超时被掐成 408，
    # 与前端 uploadFile 的 300s 超时保持一致）
    client_body_timeout 300s;

    # 前端静态文件（Vite 构建产物）
    root /opt/smart-quotation/frontend/dist;
    index index.html;

    # 前端页面与静态资源（SPA 兜底到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传大文件、AI 查询耗时较长，放宽超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
